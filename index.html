<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYTUBE - 성수동 핫플 정복!</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* [공통 스타일 리셋] */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', 'Noto Sans KR', sans-serif; background-color: #fff; color: #0f0f0f; overflow-x: hidden; }

        /* [1페이지] 랜딩 페이지 스타일 */
        #landing-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background-color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; color: #fff; text-align: center; padding: 20px;
            transition: opacity 0.5s ease;
        }
        .landing-img { width: 250px; height: auto; margin-bottom: 30px; display: block; }
        .landing-msg { font-family: 'Noto Sans KR', sans-serif; font-size: 18px; line-height: 1.8; max-width: 600px; margin-bottom: 40px; font-weight: 400; color: #ffffff; }
        .btn-start { background-color: #00a2ff; color: #fff; border: none; padding: 16px 60px; font-size: 18px; font-weight: 700; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,162,255,0.4); transition: transform 0.2s, background-color 0.2s; }
        .btn-start:hover { transform: scale(1.05); background-color: #008be2; }

        /* [앱 컨테이너] */
        .app-container { display: none; width: 100%; min-height: 100vh; }
        .icon { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .icon svg { width: 100%; height: 100%; fill: currentColor; }

        /* 상단 바 */
        .header { position: fixed; top: 0; left: 0; width: 100%; height: 56px; background-color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e5e5e5; z-index: 1000; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .logo-container { display: flex; align-items: center; gap: 4px; text-decoration: none; color: inherit; }
        .logo-play-button { width: 30px; height: 20px; background-color: #0f0f0f; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .logo-play-button::after { content: ""; border-top: 5px solid transparent; border-left: 10px solid #fff; border-bottom: 5px solid transparent; }
        .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }

        /* 사이드바 */
        .sidebar { position: fixed; top: 56px; left: 0; width: 240px; height: calc(100vh - 56px); background-color: #fff; padding: 12px; border-right: 1px solid #e5e5e5; }
        .sidebar-item { display: flex; align-items: center; gap: 24px; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: inherit; }
        .sidebar-item.active { background-color: #f2f2f2; font-weight: 500; }
        .sidebar-text { font-size: 14px; }

        /* 메인 콘텐츠 */
        .main-content { margin-left: 240px; padding-top: 56px; flex: 1; width: 100%; }
        .category-chips { display: flex; gap: 12px; padding: 12px 24px; background-color: #fff; position: sticky; top: 56px; z-index: 998; }
        .chip { background-color: rgba(0,0,0,0.05); border: none; padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .chip.active { background-color: #0f0f0f; color: #fff; }

        /* 비디오 그리드 */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px 16px; padding: 24px; }
        .video-card { display: flex; flex-direction: column; cursor: pointer; text-decoration: none; color: inherit; }
        .thumbnail-container { position: relative; width: 100%; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background-color: #e5e5e5; }
        .thumbnail-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .duration-badge { position: absolute; bottom: 8px; right: 8px; background-color: rgba(0, 0, 0, 0.8); color: #fff; padding: 3px 4px; border-radius: 4px; font-size: 12px; }

        .info-container { display: flex; margin-top: 12px; gap: 12px; }
        .channel-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
        .video-title { font-size: 16px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .channel-name { font-size: 14px; color: #606060; margin-top: 4px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

    <div id="landing-overlay">
        <img src="./image_4.png" alt="성수동 가이드" class="landing-img">
        <p class="landing-msg">
            당신이 성수동의 핫플에 방문하려고 한다.<br>
            만약, 관련 정보를 얻고 싶다면,<br>
            어떤 영상을 시청하여 정보를 얻고 싶은지 선택해주세요
        </p>
        <button class="btn-start" onclick="startRandomExperiment()">시작</button>
    </div>

    <div id="page-A" class="app-container">
        <header class="header">
            <div class="header-left"><div class="logo-container"><div class="logo-play-button"></div><span class="logo-text">MYTUBE</span></div></div>
            <div class="header-right"><img src="./image_3.png" class="user-avatar"></div>
        </header>
        <nav class="sidebar"><div class="sidebar-item active"><span class="sidebar-text">홈</span></div></nav>
        <main class="main-content">
            <div class="category-chips"><button class="chip active">전체</button></div>
            <div class="video-grid">
                <a href="https://blogger18301.tistory.com/1" class="video-card">
                    <div class="thumbnail-container"><img src="./image_1.png" class="thumbnail-img"><span class="duration-badge">1:00</span></div>
                    <div class="info-container"><img src="./image_3.png" class="channel-avatar"><div class="text-info"><h3 class="video-title">성수동 브이로그 요즘 핫플 정복!🔥</h3><div class="channel-name">A조</div></div></div>
                </a>
                <a href="https://blogger18301.tistory.com/2" class="video-card">
                    <div class="thumbnail-container"><img src="./image_2.png" class="thumbnail-img"><span class="duration-badge">1:00</span></div>
                    <div class="info-container"><img src="./image_3.png" class="channel-avatar"><div class="text-info"><h3 class="video-title">성수동 브이로그 요즘 핫플 정복!🔥</h3><div class="channel-name">A조</div></div></div>
                </a>
            </div>
        </main>
    </div>

    <div id="page-B" class="app-container">
        <header class="header">
            <div class="header-left"><div class="logo-container"><div class="logo-play-button"></div><span class="logo-text">MYTUBE</span></div></div>
            <div class="header-right"><img src="./image_3.png" class="user-avatar"></div>
        </header>
        <nav class="sidebar"><div class="sidebar-item active"><span class="sidebar-text">홈</span></div></nav>
        <main class="main-content">
            <div class="category-chips"><button class="chip active">전체</button></div>
            <div class="video-grid">
                <a href="https://blogger18301.tistory.com/1" class="video-card">
                    <div class="thumbnail-container"><img src="./image_1.png" class="thumbnail-img"><span class="duration-badge">1:00</span></div>
                    <div class="info-container"><img src="./image_3.png" class="channel-avatar"><div class="text-info"><h3 class="video-title">성수동 브이로그 요즘 핫플 정복!🔥</h3><div class="channel-name">A조</div></div></div>
                </a>
                <a href="https://blogger18301.tistory.com/3" class="video-card">
                    <div class="thumbnail-container"><img src="./image_5.png" class="thumbnail-img"><span class="duration-badge">1:00</span></div>
                    <div class="info-container"><img src="./image_3.png" class="channel-avatar"><div class="text-info"><h3 class="video-title">성수동 브이로그 요즘 핫플 정복!🔥</h3><div class="channel-name">A조</div></div></div>
                </a>
            </div>
        </main>
    </div>

    <script>
        function startRandomExperiment() {
            const overlay = document.getElementById('landing-overlay');
            
            // 1. 랜딩 페이지 페이드 아웃
            overlay.style.opacity = '0';
            
            setTimeout(() => {
                overlay.style.display = 'none';
                
                // 2. 50% 확률로 A안 또는 B안 결정
                const isTypeB = Math.random() < 0.5;
                
                if (isTypeB) {
                    document.getElementById('page-B').style.display = 'flex';
                } else {
                    document.getElementById('page-A').style.display = 'flex';
                }
                
                window.scrollTo(0, 0);
            }, 500);
        }
    </script>
</body>
</html>
