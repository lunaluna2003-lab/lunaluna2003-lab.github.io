    <style>
        /* [1] 공통 스타일 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', 'Noto Sans KR', sans-serif; background-color: #fff; color: #0f0f0f; }

        /* [2] 랜딩(로딩) 페이지 */
        #landing-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('./image_13717c.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; color: #fff; text-align: center; padding: 20px;
        }
        body.vwo-editor #landing-overlay { display: none !important; }
        body.vwo-editor .app-container { display: block !important; }

        .landing-img { width: 220px; height: auto; margin-bottom: 25px; }
        .landing-msg { font-size: 19px; line-height: 1.7; margin-bottom: 35px; font-weight: 500; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
        .btn-start { background-color: #00a2ff; color: #fff; border: none; padding: 16px 60px; font-size: 19px; font-weight: 700; border-radius: 50px; cursor: pointer; }

        /* [3] 메인 레이아웃 */
        .app-container { display: none; width: 100%; min-height: 100vh; }
        .header { position: fixed; top: 0; left: 0; width: 100%; height: 56px; background-color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e5e5e5; z-index: 1000; }
        .logo-text { font-size: 18px; font-weight: 700; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }

        .main-content { padding-top: 56px; max-width: 1200px; margin: 0 auto; }
        .category-chips { padding: 12px 16px; display: flex; gap: 8px; overflow-x: auto; }
        .chip { background-color: #0f0f0f; color: #fff; padding: 8px 14px; border-radius: 8px; border: none; font-size: 14px; white-space: nowrap; }
        .chip-light { background-color: rgba(0,0,0,0.05); color: #0f0f0f; }

        /* [4] 비디오 그리드 (반응형 설정) */
        .video-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); /* PC: 가로 2열 */
            gap: 30px 16px; 
            padding: 20px; 
        }

        /* 모바일 반응형: 화면이 768px 이하일 때 세로 1열로 배열 */
        @media (max-width: 768px) {
            .video-grid { 
                grid-template-columns: 1fr; 
                padding: 12px;
                gap: 40px;
            }
            .video-title { font-size: 15px; }
        }

        .video-card { display: flex; flex-direction: column; text-decoration: none; color: inherit; width: 100%; }
        .thumb-box { position: relative; width: 100%; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background-color: #f1f1f1; }
        .thumb-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .duration-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; padding: 2px 4px; border-radius: 4px; font-size: 11px; }

        .info { display: flex; margin-top: 12px; gap: 12px; }
        .channel-avatar { width: 36px; height: 36px; border-radius: 50%; }
        .video-title { font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-meta { font-size: 13px; color: #606060; }
    </style>
</head>
<body>

    <div id="landing-overlay">
        <img src="./image_4.png" alt="성수동 가이드" class="landing-img">
        <p class="landing-msg">성수동 핫플 정보를 얻고 싶다면,<br>어떤 영상을 시청하고 싶은지 선택해주세요.</p>
        <button class="btn-start" onclick="startApp()">시작</button>
    </div>

    <div id="page-main" class="app-container">
        <header class="header">
            <div style="display: flex; align-items: center; gap: 6px;">
                <div style="width: 30px; height: 21px; background: #ff0000; border-radius: 5px; position: relative;">
                    <div style="border-top: 4px solid transparent; border-left: 7px solid #fff; border-bottom: 4px solid transparent; position: absolute; top: 50%; left: 55%; transform: translate(-50%, -50%);"></div>
                </div>
                <span class="logo-text">YouTube</span>
            </div>
            <img src="./image_3.png" class="user-avatar" alt="User">
        </header>

        <main class="main-content">
            <div class="category-chips">
                <button class="chip">전체</button>
                <button class="chip chip-light">성수동 핫플</button>
                <button class="chip chip-light">브이로그</button>
            </div>

            <div class="video-grid">
                <!-- 실제 이미지 카드 -->
                <a href="https://blogger18301.tistory.com/2" class="video-card" id="goal-actual">
                    <div class="thumb-box">
                        <img src="./image_2.png" alt="Actual Content">
                        <span class="duration-badge">8:28</span>
                    </div>
                    <div class="info">
                        <img src="./image_3.png" class="channel-avatar">
                        <div class="text-info">
                            <h3 class="video-title">성수동 VLOG 요즘 핫플 정복!🔥 디올부터 하우스 노웨어까지✨</h3>
                            <p class="video-meta">E-비즈니스와 웹 애널리틱스_A조<br>조회수 32.5만회 • 1주 전</p>
                        </div>
                    </div>
                </a>

                <!-- AI 이미지 카드 -->
                <a href="https://blogger18301.tistory.com/1" class="video-card" id="goal-test">
                    <div class="thumb-box">
                        <img src="./image_1.png" alt="AI Content">
                        <span class="duration-badge">8:28</span>
                    </div>
                    <div class="info">
                        <img src="./image_3.png" class="channel-avatar">
                        <div class="text-info">
                            <h3 class="video-title">성수동 VLOG 요즘 핫플 정복!🔥 디올부터 하우스 노웨어까지✨</h3>
                            <p class="video-meta">E-비즈니스와 웹 애널리틱스_A조<br>조회수 32.5만회 • 1주 전</p>
                        </div>
                    </div>
                </a>
            </div>
        </main>
    </div>

    <script>
        // VWO 에디터 및 프리뷰 모드 감지
        if (window.location.href.indexOf('vwo_editor') > -1 || window.name.indexOf('_vis_preview') > -1) {
            document.body.classList.add('vwo-editor');
        }

        // 앱 시작 함수
        function startApp() {
            document.getElementById('landing-overlay').style.display = 'none';
            document.getElementById('page-main').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
