<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>성수동 핫플 탐방 A/B 테스트</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">

    <script type='text/javascript' id='vwoCode'>
        /* 본인의 VWO Async SmartCode를 여기에 붙여넣으시면 실험 데이터가 수집됩니다. */
    </script>

    <style>
        /* 기본 리셋 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #fff; color: #0f0f0f; overflow-x: hidden; }

        /* [2] 1단계: 랜딩 페이지 (검정 바탕) */
        #landing-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background-color: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000;
            color: #fff; text-align: center; padding: 20px;
            transition: opacity 0.5s ease;
        }
        .landing-img { width: 250px; height: auto; margin-bottom: 30px; }
        .landing-msg {
            font-size: 18px; line-height: 1.8; max-width: 600px;
            margin-bottom: 40px; word-break: keep-all; font-weight: 400;
        }
        .btn-start {
            background-color: #00a2ff; color: #fff; border: none; padding: 16px 60px;
            font-size: 18px; font-weight: 700; border-radius: 50px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,162,255,0.4);
            transition: transform 0.2s;
        }
        .btn-start:hover { transform: scale(1.05); }

        /* [3] 2단계: 깃허브 목록 페이지 (유튜브 스타일) */
        #main-content { display: none; padding-top: 70px; } /* 처음엔 숨김 */
        .header { position: fixed; top: 0; width: 100%; height: 56px; background: #fff; border-bottom: 1px solid #eee; display: flex; align-items: center; padding: 0 16px; z-index: 1000; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        
        .video-card { text-decoration: none; color: inherit; display: block; cursor: pointer; }
        .thumb-box { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #eee; position: relative; }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
        .duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; padding: 2px 4px; border-radius: 4px; font-size: 12px; }
        
        .v-title { font-size: 16px; font-weight: bold; margin-top: 10px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .v-meta { font-size: 14px; color: #606060; margin-top: 4px; }
    </style>
</head>
<body>

    <div id="landing-overlay">
        <img src="./image_10be01.jpg" alt="성수동 캐릭터" class="landing-img">
        <p class="landing-msg">
            당신이 성수동의 핫플에 방문하려고 한다.<br>
            만약, 관련 정보를 얻고 싶다면 어떤 영상을 시청하여 정보를 얻고 싶은지 선택해주세요
        </p>
        <button class="btn-start" onclick="openApp()">시작</button>
    </div>

    <div id="main-content">
        <header class="header">
            <b style="font-size: 20px; color: #f00;">MyTube <span style="color:#000">실험실</span></b>
        </header>

        <div class="video-grid">
            <a href="https://blogger18301.tistory.com/1" target="_blank" class="video-card">
                <div class="thumb-box">
                    <img src="./image_1.png" alt="성수동 낮">
                    <span class="duration">1:00</span>
                </div>
                <h3 class="v-title">성수동 브이로그 요즘 핫플 정복!🔥 디올부터 하우스 노웨어까지✨</h3>
                <p class="v-meta">E-비즈니스 A조 • 조회수 240회</p>
            </a>

            <a href="https://blogger18301.tistory.com/2" target="_blank" class="video-card">
                <div class="thumb-box">
                    <img src="./image_2.png" alt="성수동 밤">
                    <span class="duration">1:00</span>
                </div>
                <h3 class="v-title">매운탕은 하나 요리사는 8명 #런닝맨 스타일 실험 페이지</h3>
                <p class="v-meta">E-비즈니스 A조 • 조회수 240회</p>
            </a>
        </div>
    </div>

    <script>
        /**
         * 시작 버튼 클릭 시 실행되는 함수
         * 랜딩 페이지를 지우고 목록 페이지를 보여줍니다.
         */
        function openApp() {
            const overlay = document.getElementById('landing-overlay');
            const content = document.getElementById('main-content');
            
            overlay.style.opacity = '0'; // 투명도 애니메이션
            
            setTimeout(() => {
                overlay.style.display = 'none'; // 레이어 제거
                content.style.display = 'block'; // 본래 페이지 노출
            }, 500);
        }
    </script>
</body>
</html>
