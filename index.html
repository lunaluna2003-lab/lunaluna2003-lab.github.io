<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYTUBE - 성수동 핫플 정복!</title>
    
    <link rel="preconnect" href="https://dev.visualwebsiteoptimizer.com" />
    <script type='text/javascript' id='vwoCode'>
        /* 여기에 기존 VWO 코드를 그대로 유지해 주세요 */
        window._vwo_code || (function() {
            var w=window,d=document,account_id=1212776,version=2.2,settings_tolerance=2000,hide_element='body',hide_element_style='opacity:0 !important;filter:alpha(opacity=0) !important;background:none !important',f=0,v,cc={};
            w._vwo_code=code;code.init();
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', 'Noto Sans KR', sans-serif; background-color: #fff; color: #0f0f0f; overflow-x: hidden; }

        /* [1] 랜딩 페이지 - 이미지 4 적용 */
        #landing-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('./image_4.png');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; color: #fff; text-align: center; padding: 20px; transition: opacity 0.5s ease;
        }
        .landing-img { width: 250px; height: auto; margin-bottom: 30px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
        .btn-start { background-color: #00a2ff; color: #fff; border: none; padding: 18px 70px; font-size: 20px; font-weight: 700; border-radius: 50px; cursor: pointer; }

        /* [2] 메인 레이아웃 */
        .app-container { display: none; width: 100%; min-height: 100vh; }
        .header { position: fixed; top: 0; left: 0; width: 100%; height: 56px; background-color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e5e5e5; z-index: 1000; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }

        .main-content { padding-top: 56px; max-width: 1200px; margin: 0 auto; }
        .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 24px; }
        
        .video-card { text-decoration: none; color: inherit; cursor: pointer; }
        .thumbnail-container { position: relative; width: 100%; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background-color: #f0f0f0; }
        .thumbnail-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .info-container { display: flex; margin-top: 12px; gap: 12px; }
        .channel-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .video-title { font-size: 15px; font-weight: 600; line-height: 1.4; }

        @media (max-width: 600px) { .video-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="landing-overlay">
        <img src="./image_4.png" alt="Logo" class="landing-img">
        <p style="font-size: 18px; margin-bottom: 30px; line-height: 1.6;">성수동 핫플 정보를 얻기 위해<br>어떤 영상을 시청하시겠습니까?</p>
        <button class="btn-start" onclick="shuffleAndStart()">시작하기</button>
    </div>

    <div id="page-main" class="app-container">
        <header class="header">
            <div style="font-weight: bold; font-size: 18px;">MYTUBE</div>
            <img src="./image_3.png" class="user-avatar" alt="Profile">
        </header>

        <main class="main-content">
            <div class="video-grid" id="video-grid-container"></div>
        </main>
    </div>

    <script>
        // 1. 실제 사진 카드 (이미지 2)
        const realCard = `
            <a id="click-real" class="video-card">
                <div class="thumbnail-container"><img src="./image_2.png" class="thumbnail-img"></div>
                <div class="info-container">
                    <img src="./image_3.png" class="channel-avatar">
                    <div class="text-info"><h3 class="video-title">성수동 핫플 브이로그! 요즘 가장 뜨는 코스 정복기✨</h3><p style="font-size:13px; color:#606060;">E-비즈니스 A조</p></div>
                </div>
            </a>
        `;

        // 2. AI 사진 카드 (이미지 1)
        const aiCard = `
            <a id="click-ai" class="video-card">
                <div class="thumbnail-container"><img src="./image_1.png" class="thumbnail-img"></div>
                <div class="info-container">
                    <img src="./image_3.png" class="channel-avatar">
                    <div class="text-info"><h3 class="video-title">성수동 핫플 브이로그! 요즘 가장 뜨는 코스 정복기🔥</h3><p style="font-size:13px; color:#606060;">E-비즈니스 A조</p></div>
                </div>
            </a>
        `;

        // 3. AI 표기 사진 카드 (이미지 5)
        const aiLabelCard = `
            <a id="click-ai-label" class="video-card">
                <div class="thumbnail-container"><img src="./image_5.png" class="thumbnail-img"></div>
                <div class="info-container">
                    <img src="./image_3.png" class="channel-avatar">
                    <div class="text-info"><h3 class="video-title">[AI 생성] 성수동 핫플 브이로그! 요즘 뜨는 코스✨</h3><p style="font-size:13px; color:#606060;">E-비즈니스 A조</p></div>
                </div>
            </a>
        `;

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function shuffleAndStart() {
            const container = document.getElementById('video-grid-container');
            
            // 이미지 1(AI) 혹은 이미지 5(AI표기) 중 하나를 무작위 선택
            const selectedAICard = Math.random() < 0.5 ? aiCard : aiLabelCard;
            
            // 실제 사진(이미지 2)와 위에서 선택된 카드를 리스트에 넣음
            let finalCards = [realCard, selectedAICard];

            // 좌우 편향을 없애기 위해 순서 섞기
            shuffle(finalCards);

            container.innerHTML = finalCards.join('');

            // 화면 전환 애니메이션
            document.getElementById('landing-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('landing-overlay').style.display = 'none';
                document.getElementById('page-main').style.display = 'block';
            }, 500);
        }
    </script>
</body>
</html>
