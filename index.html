<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYTUBE - 성수동 핫플 실험</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* [1] 랜딩(로딩) 페이지 스타일 */
        #landing-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('./image_13717c.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; color: #fff; text-align: center; padding: 20px;
        }
        /* VWO 에디터에서 방해받지 않도록 설정 */
        body.vwo-editor #landing-overlay { display: none !important; }
        body.vwo-editor .app-container { display: block !important; }

        .landing-img { width: 250px; height: auto; margin-bottom: 30px; }
        .landing-msg { font-size: 20px; margin-bottom: 40px; font-weight: 500; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .btn-start { background-color: #00a2ff; color: #fff; border: none; padding: 18px 70px; font-size: 20px; font-weight: 700; border-radius: 50px; cursor: pointer; transition: 0.3s; }

        /* [2] 메인 레이아웃 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', 'Noto Sans KR', sans-serif; background-color: #fff; }
        .app-container { display: none; width: 100%; min-height: 100vh; }
        .header { position: fixed; top: 0; left: 0; width: 100%; height: 56px; background-color: #fff; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e5e5e5; z-index: 1000; }
        .logo-text { font-size: 20px; font-weight: 700; color: #ff0000; letter-spacing: -1px; }
        
        .main-content { padding-top: 56px; max-width: 1200px; margin: 0 auto; }
        .category-chips { padding: 12px 24px; display: flex; gap: 10px; }
        .chip { background-color: #0f0f0f; color: #fff; padding: 8px 16px; border-radius: 8px; border: none; font-size: 14px; }

        /* [3] 비디오 그리드 */
        .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 24px; }
        .video-card { display: flex; flex-direction: column; text-decoration: none; color: inherit; }
        .thumb-box { position: relative; width: 100%; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background-color: #eee; }
        .thumb-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .info { display: flex; margin-top: 12px; gap: 12px; }
        .video-title { font-size: 16px; font-weight: 600; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="landing-overlay">
        <img src="./image_4.png" alt="성수동 가이드" class="landing-img">
        <p class="landing-msg">성수동 핫플 정보를 얻고 싶다면 영상을 선택해주세요.</p>
        <button class="btn-start" onclick="startApp()">시작</button>
    </div>

    <div id="page-main" class="app-container">
        <header class="header">
            <span class="logo-text">▶ MYTUBE</span>
        </header>

        <main class="main-content">
            <div class="category-chips">
                <button class="chip">전체</button>
                <button class="chip" style="background:#eee; color:#000;">성수동 핫플</button>
            </div>
            <div class="video-grid">
                
                <a href="https://blogger18301.tistory.com/2" class="video-card" id="goal-actual">
                    <div class="thumb-box"><img src="./image_2.png" id="img-left"></div>
                    <div class="info">
                        <div style="width:36px; height:36px; border-radius:50%; background:#ddd;"></div>
                        <div class="text-info">
                            <h3 class="video-title" id="title-left">성수동 브이로그 요즘 핫플 정복! (실제)</h3>
                            <p style="font-size:14px; color:#606060; margin-top:4px;">E-비즈니스와 웹 애널리틱스_A조</p>
                        </div>
                    </div>
                </a>

                <a href="https://blogger18301.tistory.com/1" class="video-card" id="goal-test">
                    <div class="thumb-box"><img src="./image_1.png" id="img-right"></div>
                    <div class="info">
                        <div style="width:36px; height:36px; border-radius:50%; background:#ddd;"></div>
                        <div class="text-info">
                            <h3 class="video-title" id="title-right">성수동 브이로그 요즘 핫플 정복! (AI)</h3>
                            <p style="font-size:14px; color:#606060; margin-top:4px;">E-비즈니스와 웹 애널리틱스_A조</p>
                        </div>
                    </div>
                </a>

            </div>
        </main>
    </div>

    <script>
        // VWO 에디터 모드 감지
        if (window.location.href.indexOf('vwo_editor') > -1 || window.name.indexOf('_vis_preview') > -1) {
            document.body.classList.add('vwo-editor');
        }

        function startApp() {
            document.getElementById('landing-overlay').style.display = 'none';
            document.getElementById('page-main').style.display = 'block';
        }
    </script>
</body>
</html>
