<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYTUBE - 성수동 핫플 정복!</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* [1] 랜딩(로딩) 페이지 스타일 */
        #landing-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('./image_13717c.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; color: #fff; text-align: center; padding: 20px;
        }
        /* VWO 에디터에서 방해받지 않도록 설정 */
        body.vwo-editor #landing-overlay { display: none !important; }
        body.vwo-editor .app-container { display: block !important; }

        .landing-img { width: 250px; height: auto; margin-bottom: 30px; }
        .landing-msg { font-family: 'Noto Sans KR', sans-serif; font-size: 20px; line-height: 1.8; max-width: 700px; margin-bottom: 40px; font-weight: 500; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        .btn-start { background-color: #00a2ff; color: #fff; border: none; padding: 18px 70px; font-size: 20px; font-weight: 700; border-radius: 50px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 20px rgba(0,162,255,0.5); }

        /* [2] 메인 레이아웃 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', 'Noto Sans KR', sans-serif; background-color: #fff; color: #0f0f0f; }
        .app-container { display: none; width: 100%; min-height: 100vh; }
        
        .header { position: fixed; top: 0; left: 0; width: 100%; height: 56px; background-color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e5e5e5; z-index: 1000; }
        .logo-container { display: flex; align-items: center; gap: 4px; text-decoration: none; color: inherit; }
        .logo-play-button { width: 30px; height: 20px; background-color: #ff0000; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
        .logo-play-button::after { content: ""; border-top: 5px solid transparent; border-left: 10px solid #fff; border-bottom: 5px solid transparent; }
        .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -1px; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        
        .main-content { padding-top: 56px; max-width: 1200px; margin: 0 auto; }
        .category-chips { padding: 12px 24px; display: flex; gap: 12px; overflow-x: auto; }
        .chip { background-color: #0f0f0f; color: #fff; padding: 8px 16px; border-radius: 8px; border: none; font-size: 14px; white-space: nowrap; }
        .chip-light { background-color: rgba(0,0,0,0.05); color: #0f0f0f; }

        /* [3] 비디오 그리드 */
        .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px 16px; padding: 24px; }
        .video-card { display: flex; flex-direction: column; text-decoration: none; color: inherit; }
        .thumb-box { position: relative; width: 100%; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background-color: #e5e5e5; }
        .thumb-box img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .duration-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; padding: 2px 4px; border-radius: 4px; font-size: 12px; }
        
        .info { display: flex; margin-top: 12px; gap: 12px; }
        .channel-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .video-title { font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-meta { font-size: 14px; color: #606060; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="landing-overlay">
        <img src="./image_4.png" alt="성수동 가이드" class="landing-img">
        <p class="landing-msg"> 당신이 성수동의 핫플에 방문하려고 한다.<br>  만약, 관련 정보를 얻고 싶다면,<br>
            어떤 영상을 시청하여 정보를 얻고 싶은지 선택해주세요</p>
        <button class="btn-start" onclick="startApp()">시작</button>
    </div>

    <div id="page-main" class="app-container">
        <header class="header">
            <div class="logo-container">
                <div class="logo-play-button"></div>
                <span class="logo-text">YouTube</span>
            </div>
            <img src="./image_3.png" class="user-avatar" alt="사용자 프로필">
        </header>

        <main class="main-content">
            <div class="category-chips">
                <button class="chip">전체</button>
                <button class="chip chip-light">성수동 핫플</button>
                <button class="chip chip-light">브이로그</button>
            </div>
            
            <div class="video-grid">
                
                <a href="https://blogger18301.tistory.com/2" class="video-card" id="goal-actual">
                    <div class="thumb-box">
                        <img src="./image_2.png" id="img-left">
                        <span class="duration-badge">8:28</span>
                    </div>
                    <div class="info">
                        <img src="./image_3.png" class="channel-avatar">
                        <div class="text-info">
                            <h3 class="video-title" id="title-left">성수동 VLOG 요즘 핫플 정복!🔥 디올부터 하우스 노웨어까지✨</h3>
                            <p class="video-meta">E-비즈니스와 웹 애널리틱스_A조<br>조회수 32.5만회 • 1주 전</p>
                        </div>
                    </div>
                </a>

                <a href="https://blogger18301.tistory.com/1" class="video-card" id="goal-test">
                    <div class="thumb-box">
                        <img src="./image_1.png" id="img-right">
                        <span class="duration-badge">6:25</span>
                    </div>
                    <div class="info">
                        <img src="./image_3.png" class="channel-avatar">
                        <div class="text-info">
                            <h3 class="video-title" id="title-right">성수동 VLOG 요즘 핫플 정복!🔥 디올부터 하우스 노웨어까지✨ </h3>
                            <p class="video-meta">E-비즈니스와 웹 애널리틱스_A조<br>조회수 20.9만회 • 1주 전</p>
                        </div>
                    </div>
                </a>

            </div>
        </main>
    </div>

    <script>
        if (window.location.href.indexOf('vwo_editor') > -1 || window.name.indexOf('_vis_preview') > -1) {
            document.body.classList.add('vwo-editor');
        }

        function startApp() {
            document.getElementById('landing-overlay').style.display = 'none';
            document.getElementById('page-main').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
