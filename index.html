<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTUBE - 성수동 핫플</title>
    
    <style>
        /* [중요] 모든 숨김 설정을 무력화하고 강제로 화면을 보여줍니다 */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            opacity: 1 !important; visibility: visible !important; display: block !important;
            background-color: #fff; font-family: sans-serif;
        }

        /* 랜딩 페이지 (시작 화면) */
        #landing-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('./image_5.png'); /* 배경: image_5.png */
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; color: white; text-align: center;
        }

        .landing-img { width: 200px; margin-bottom: 20px; }
        .btn-start { 
            background: #00a2ff; color: white; border: none; padding: 15px 50px; 
            font-size: 18px; border-radius: 30px; cursor: pointer; font-weight: bold;
        }

        /* 메인 화면 (처음엔 숨김) */
        #main-app { display: none; padding-top: 60px; }
        .header { position: fixed; top: 0; width: 100%; height: 56px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 20px; z-index: 100; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 20px; }
        .video-card { text-decoration: none; color: black; }
        .video-card img { width: 100%; border-radius: 12px; }
    </style>
</head>
<body>

    <div id="landing-overlay">
        <img src="./image_4.png" class="landing-img"> <h2>성수동 핫플 정복!</h2>
        <p>어떤 영상을 보고 싶으신가요?</p>
        <button class="btn-start" onclick="showMain()">시작하기</button>
    </div>

    <div id="main-app">
        <div class="header">
            <strong style="color:red; font-size:20px;">MYTUBE</strong>
        </div>
        <div class="video-grid" id="grid">
            </div>
    </div>

    <script>
        function showMain() {
            // 카드 데이터 (image_1.png, image_2.png 사용)
            const cards = [
                `<a href="https://blogger18301.tistory.com/1" class="video-card"><img src="./image_1.png"><h3>성수동 브이로그 (A)</h3></a>`,
                `<a href="https://blogger18301.tistory.com/1" class="video-card"><img src="./image_2.png"><h3>성수동 브이로그 (B)</h3></a>`
            ];

            // 랜덤하게 섞기
            cards.sort(() => Math.random() - 0.5);

            document.getElementById('grid').innerHTML = cards.join('');
            document.getElementById('landing-overlay').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }
    </script>
</body>
</html>
