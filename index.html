<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYTUBE - 성수동 핫플</title>
    
    <style>
        /* 기본 설정: VWO 등 외부 간섭 없이 강제 출력 */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            opacity: 1 !important; visibility: visible !important; display: block !important;
            background-color: #ffffff; font-family: 'Noto Sans KR', sans-serif;
        }

        /* [수정] 랜딩 페이지: 깨끗한 화이트 배경 */
        #landing-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff; /* 흰색 배경 */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; text-align: center; padding: 20px;
        }

        .landing-img { 
            width: 220px; height: auto; margin-bottom: 25px; 
            border-radius: 15px; /* 약간의 곡률로 부드럽게 */
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); /* 은은한 그림자 */
        }

        .landing-title { font-size: 26px; font-weight: 700; color: #0f0f0f; margin-bottom: 10px; }
        .landing-msg { font-size: 16px; color: #606060; line-height: 1.6; margin-bottom: 35px; }

        .btn-start { 
            background: #00a2ff; color: white; border: none; padding: 16px 60px; 
            font-size: 18px; border-radius: 50px; cursor: pointer; font-weight: bold;
            transition: transform 0.2s ease;
        }
        .btn-start:hover { transform: scale(1.05); }

        /* 메인 앱 화면 */
        #main-app { display: none; padding-top: 56px; background-color: #f9f9f9; min-height: 100vh; }
        
        .header { 
            position: fixed; top: 0; width: 100%; height: 56px; 
            background: white; border-bottom: 1px solid #e5e5e5; 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 16px; z-index: 100; 
        }
        
        .logo-box { display: flex; align-items: center; text-decoration: none; color: inherit; }
        .logo-play { width: 30px; height: 20px; background: red; border-radius: 4px; display: flex; align-items: center; justify-content: center; margin-right: 8px; }
        .logo-play::after { content: ""; border-top: 5px solid transparent; border-left: 10px solid #fff; border-bottom: 5px solid transparent; }
        .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }

        .user-profile { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px 16px; padding: 24px; }
        .video-card { text-decoration: none; color: black; }
        .video-card img { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; }
        .video-title { font-size: 16px; font-weight: 600; margin-top: 12px; line-height: 1.4; }
        .channel-info { font-size: 14px; color: #606060; margin-top: 4px; }
    </style>
</head>
<body>

    <div id="landing-overlay">
        <img src="./image_4.png" class="landing-img" alt="성수동 가이드">
        <div class="landing-title">성수동 핫플 정복!🔥</div>
        <div class="landing-msg">
            성수동의 핫한 장소들이 궁금하신가요?<br>
            가장 시청하고 싶은 영상을 선택해 주세요.
        </div>
        <button class="btn-start" onclick="showMain()">시작하기</button>
    </div>

    <div id="main-app">
        <div class="header">
            <a href="#" class="logo-box">
                <div class="logo-play"></div>
                <span class="logo-text">MYTUBE</span>
            </a>
            <img src="./image_3.png" class="user-profile" alt="User profile">
        </div>

        <div class="video-grid" id="grid">
            </div>
    </div>

    <script>
        function showMain() {
            const cards = [
                `<a href="https://blogger18301.tistory.com/1" class="video-card">
                    <img src="./image_1.png">
                    <h3 class="video-title">성수동 브이로그 요즘 핫플 정복!🔥 디올부터 하우스 노웨어까지✨ </h3>
                    <div class="channel-info">E-비즈니스와 웹 애널리틱스 A조</div>
                </a>`,
                `<a href="https://blogger18301.tistory.com/1" class="video-card">
                    <img src="./image_2.png">
                    <h3 class="video-title">성수동 브이로그 요즘 핫플 정복!🔥 디올부터 하우스 노웨어까지✨ </h3>
                    <div class="channel-info">E-비즈니스와 웹 애널리틱스 A조</div>
                </a>`
            ];

            cards.sort(() => Math.random() - 0.5);
            document.getElementById('grid').innerHTML = cards.join('');
            document.getElementById('landing-overlay').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
        }
    </script>
</body>
</html>
