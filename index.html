<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MYTUBE 실험 페이지</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f9f9f9; }
        .video-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .video-card { background: white; border-radius: 12px; overflow: hidden; text-decoration: none; color: #000; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .thumb-box { width: 100%; aspect-ratio: 16/9; background: #eee; }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
        .info { padding: 15px; }
        .video-title { font-size: 16px; font-weight: bold; margin: 0; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="video-grid">
        <a href="https://blogger18301.tistory.com/1" class="video-card" id="card-actual">
            <div class="thumb-box"><img src="./image_1.png" id="img-actual"></div>
            <div class="info"><h3 class="video-title" id="title-actual">성수동 브이로그 (실제 촬영)</h3></div>
        </a>

        <a href="https://blogger18301.tistory.com/2" class="video-card" id="card-ai-1">
            <div class="thumb-box"><img src="./image_2.png" id="img-ai-1"></div>
            <div class="info"><h3 class="video-title" id="title-ai-1">성수동 브이로그 (AI 생성)</h3></div>
        </a>

        <a href="https://blogger18301.tistory.com/3" class="video-card" id="card-ai-2">
            <div class="thumb-box"><img src="./image_3.png" id="img-ai-2"></div>
            <div class="info"><h3 class="video-title" id="title-ai-2">성수동 브이로그 (AI 표시 포함)</h3></div>
        </a>
    </div>

</body>
</html>
