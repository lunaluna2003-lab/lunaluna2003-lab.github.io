<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MYTUBE - 성수동 핫플 정복!</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* [중요] VWO의 화면 숨김 설정을 강제로 무력화합니다 */
        body { 
            opacity: 1 !important; 
            display: block !important;
            visibility: visible !important;
            margin: 0; padding: 0;
            font-family: 'Roboto', 'Noto Sans KR', sans-serif;
        }

        /* 랜딩 페이지 배경 이미지를 깃허브에 있는 image_5.png로 변경 */
        #landing-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('./image_5.png');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; color: #fff; text-align: center; padding: 20px;
        }
        
        .landing-img { width: 250px; height: auto; margin-bottom: 30px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }
        .landing-msg { font-size: 20px; line-height: 1.8; margin-bottom: 40px; font-weight: 500; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        .btn-start { 
            background-color: #00a2ff; color: #fff; border: none; padding: 18px 70px; 
            font-size: 20px; font-weight: 700; border-radius: 50px; cursor: pointer; 
            box-shadow: 0 4px 20px rgba(0,162,255,0.5); 
        }

        /* 유튜브 스타일 메인 */
        .app-container { display: none; width: 100%; min-height: 100vh; padding-top: 56px; }
        .header { position: fixed; top: 0; left: 0; width: 100%; height: 56px; background: #fff; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e5e5e5; z-index: 1000; justify-content: space-between; }
        .logo-text { font-size: 20px; font-weight: 700; color: #0f0f0f; text-decoration: none; }
        
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; padding: 24px; }
        .video-card { text-decoration: none; color: inherit; }
        .thumb { width: 100%; border-radius: 12px; aspect-ratio: 16/9; object-fit: cover; }
        .video-title { font-size: 16px; font-weight: 600; margin-top: 12px; }
    </style>
</head>
<body>

    <div id="landing-overlay">
        <img src="./image_4.png" alt="성수동 가이드" class="landing-img">
        <p class="landing-msg">
            성수동 핫플 정보를 얻고 싶다면,<br>
            어떤 영상을 시청하고 싶은지 선택해주세요!
        </p>
        <button class="btn-start" onclick="startApp()">시작하기</button>
    </div>

    <div id="page-main" class="app-container">
        <header class="header">
            <a href="#" class="logo-text">MYTUBE</a>
            <div style="font-weight: bold;">성수동 핫플 검색 결과</div>
            <img src="./image_3.png" style="width:32px; height:32px; border-radius:50%;">
        </header>

        <div class="video-grid" id="video-grid">
            </div>
    </div>

    <script>
        const card1 = `
            <div class="video-card">
                <img src="./image_1.png" class="thumb">
                <div class="video-title">성수동 브이로그 요즘 핫플 정복!🔥 (A버전)</div>
            </div>`;
        const card2 = `
            <div class="video-card">
                <img src="./image_2.png" class="thumb">
                <div class="video-title">성수동 브이로그 요즘 핫플 정복!🔥 (B버전)</div>
            </div>`;

        function startApp() {
            const grid = document.getElementById('video-grid');
            const items = [card1, card2];
            items.sort(() => Math.random() - 0.5); // 간단 셔플
            grid.innerHTML = items.join('');

            document.getElementById('landing-overlay').style.display = 'none';
            document.getElementById('page-main').style.display = 'block';
        }
    </script>
</body>
</html>
