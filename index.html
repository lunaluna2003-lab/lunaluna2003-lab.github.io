<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>성수동 핫플 탐방 A/B 테스트</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script type='text/javascript' id='vwoCode'>
        /* 이 자리에 원래 사용하시던 VWO Async SmartCode를 붙여넣으시면 됩니다. */
    </script>

    <style>
        /* 기본 리셋 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', 'Noto Sans KR', sans-serif; background-color: #fff; color: #0f0f0f; overflow-x: hidden; }

        /* [2] 1단계: 랜딩 페이지 (검정 바탕) */
        #landing-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background-color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000; color: #fff; text-align: center; padding: 20px; box-sizing: border-box;
            transition: opacity 0.5s ease;
        }
        .landing-img { width: 250px; height: auto; margin-bottom: 30px; display: block; }
        .landing-msg { font-size: 18px; line-height: 1.8; max-width: 600px; margin-bottom: 40px; font-weight: 400; color: #ffffff; }
        .btn-start { background-color: #00a2ff; color: #fff; border: none; padding: 16px 60px; font-size: 18px; font-weight: 700; border-radius: 50px; cursor: pointer; transition: transform 0.2s; }
        .btn-start:hover { transform: scale(1.05); }

        /* [3] 2단계: 깃허브 본래 목록 페이지 (유튜브 스타일) */
        #main-app { display: none; width: 100%; padding-top: 56px; }
        .header { position: fixed; top: 0; left: 0; width: 100%; height: 56px; background-color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #e5e5e5; z-index: 1000; }
        .logo-text { font-size: 20px; font-weight: 700; color: #0f0f0f; text-decoration: none; }
        
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px 16px; padding: 24px; max-width: 1400px; margin: 0 auto; }
        .video-card { display: flex; flex-direction: column; cursor: pointer; text-decoration: none; color: inherit; width: 100%; }
        .thumbnail-container { position: relative; width: 100%; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background-color: #eee; }
        .thumbnail-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; padding: 2px 4px; border-radius: 4px; font-size: 12px; }
        
        .info-box { display: flex; margin-top: 12px; gap: 12px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: #ddd; flex-shrink: 0; }
        .v-title { font-size: 16px; font-weight: 600; line-height: 1.4; color: #0f0f0f; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .v-meta { font-size: 14px; color: #606060; margin-top: 4px; }
    </style>
</head>
<body>

    <div id="landing-overlay">
        <img src="./image_4.png" alt="미모티콘" class="landing-img">
        <p class="landing-msg">
            당신이 성수동의 핫플에 방문하려고 한다.<br>
            만약, 관련 정보를 얻고 싶다면,<br>
            어떤 영상을 시청하여 정보를 얻고 싶은지 선택해주세요
        </p>
        <button class="btn-start" onclick="startExperiment()">시작</button>
    </div>

    <div id="main-app">
        <header class="header">
            <a href="#" class="logo-text">🔴 MyTube 실험실</a>
            <img src="./image_3.png" alt="프로필" style="width:32px; height:32px; border-radius:50%;">
        </header>

        <main class="video-grid">
            <a href="https://blogger18301.tistory.com/1" target="_blank" class="video-card">
                <div class="thumbnail-container">
                    <img src="./image_1.png" alt="성수동 낮" class="thumbnail-img">
                    <span class="duration">1:00</span>
                </div>
                <div class="info-box">
                    <div class="avatar"></div>
                    <div>
                        <h3 class="v-title">성수동 브이로그 요즘 핫플 정복!🔥 디올부터 하우스 노웨어까지✨</h3>
                        <p class="v-meta">E-비즈니스 A조 • 조회수 240회</p>
                    </div>
                </div>
            </a>

            <a href="https://blogger18301.tistory.com/2" target="_blank" class="video-card">
                <div class="thumbnail-container">
                    <img id="dynamic-thumb" src="" alt="실험 영상" class="thumbnail-img">
                    <span class="duration">1:00</span>
                </div>
                <div class="info-box">
                    <div class="avatar"></div>
                    <div>
                        <h3 class="v-title">매운탕은 하나 요리사는 8명 #런닝맨 스타일 실험 페이지</h3>
                        <p class="v-meta">E-비즈니스 A조 • 조회수 240회</p>
                    </div>
                </div>
            </a>
        </main>
    </div>

    <script>
        /**
         * [핵심 로직] 접속 시 무작위로 이미지를 선택합니다.
         * 50% 확률로 image_2.png (A안), 50% 확률로 image_5.png (B안)
         */
        document.addEventListener("DOMContentLoaded", function() {
            const thumbImg = document.getElementById('dynamic-thumb');
            const randomValue = Math.random(); // 0~1 사이의 난수 발생

            if (randomValue < 0.5) {
                thumbImg.src = "./image_2.png"; // A안: 원래 이미지
            } else {
                thumbImg.src = "./image_5.png"; // B안: 실험용 이미지
            }
        });

        /**
         * 시작 버튼 클릭 시 랜딩 페이지를 지우고 목록을 보여주는 함수
         */
        function startExperiment() {
            const overlay = document.getElementById('landing-overlay');
            const mainApp = document.getElementById('main-app');
            
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                mainApp.style.display = 'block';
                window.scrollTo(0, 0);
            }, 500);
        }
    </script>
</body>
</html>
