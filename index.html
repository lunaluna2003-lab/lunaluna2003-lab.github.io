<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비주얼 선호도 테스트</title>
    
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        .container {
            display: flex;
            gap: 20px;
            max-width: 1000px;
            padding: 20px;
        }
        .video-box {
            flex: 1;
            text-align: center;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .video-box:hover {
            transform: translateY(-5px);
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            object-fit: cover;
        }
        h2 {
            font-size: 1.1rem;
            margin-top: 15px;
            color: #333;
        }
    </style>
</head>
<body>

    <h1>더 끌리는 이미지를 클릭해주세요</h1>
    
    <div class="container">
        <div class="video-box" id="actual-video">
            <img src="image_2.png" alt="Real Image">
            <h2 id="actual-title">성수동 핫플 정복!</h2>
        </div>

        <div class="video-box" id="test-video">
            <img src="image_1.png" alt="Test Image">
            <h2 id="test-title">성수동 핫플 정복!</h2>
        </div>
    </div>

    <script>
        // 클릭 시 블로그로 이동하는 간단한 기능만 남깁니다.
        const blogUrl = "https://blogger18301.tistory.com/1";

        document.getElementById('actual-video').addEventListener('click', () => {
            window.location.href = blogUrl;
        });

        document.getElementById('test-video').addEventListener('click', () => {
            window.location.href = blogUrl;
        });
    </script>
</body>
</html>
