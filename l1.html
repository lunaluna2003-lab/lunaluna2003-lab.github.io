<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실험 참여 안내</title>
    <style>
        :root {
            --primary-color: #ff5a5f; /* 성수동의 활기찬 느낌을 주는 포인트 컬러 */
            --bg-color: #ffffff;
            --text-color: #222222;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: #f0f2f5;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            line-height: 1.6;
        }

        .container {
            background: white;
            padding: 3rem 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 550px;
            width: 90%;
            text-align: center;
        }

        .question-highlight {
            background: #fff0f0;
            color: var(--primary-color);
            padding: 1.5rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            border-left: 5px solid var(--primary-color);
        }

        h2 {
            font-size: 1.4rem;
            word-break: keep-all;
            margin: 0;
            line-height: 1.4;
        }

        .instruction-box {
            text-align: left;
            margin-bottom: 2.5rem;
            padding: 0 0.5rem;
        }

        .instruction-box h3 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #555;
        }

        .instruction-box ul {
            padding-left: 1.2rem;
            color: #666;
            font-size: 0.95rem;
        }

        .instruction-box li {
            margin-bottom: 0.7rem;
        }

        .start-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 3rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .start-btn:hover {
            background-color: #e34b50;
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="question-highlight">
        <h2>"당신이 성수동을 간다면 어떤 영상을 보고 정보를 얻고 싶은가요?"</h2>
    </div>
    
    <div class="instruction-box">
        <h3>실험 시작 전 안내</h3>
        <ul>
            <li>본 실험은 성수동 방문 관련 영상 콘텐츠 선호도를 파악하기 위한 실험입니다.</li>
            <li>제시되는 영상을 시청하신 후 본인의 솔직한 느낌을 선택해 주세요.</li>
            <li>약 5분 내외의 시간이 소요되며, 중도 이탈 시 데이터가 저장되지 않습니다.</li>
        </ul>
    </div>

    <a href="experiment.html" class="start-btn">실험 시작하기</a>

    <p class="footer-note">제공해주신 데이터는 연구 및 통계 목적으로만 활용됩니다.</p>
</div>

</body>
</html>
